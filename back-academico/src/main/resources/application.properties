# Nome da aplicacao
spring.application.name=back-academico

# Porta do servidor
server.port=8080

# ==== Conexao com o PostgreSQL ====
# Ajuste o host/porta/usuario/senha conforme o seu ambiente
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/classpath}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
# "update" cria/atualiza as tabelas automaticamente a partir das entidades
# (ideal para o protótipo; em produção o recomendado seria usar migrations)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Impede que consultas ao banco fiquem abertas durante a serializacao JSON.
# Os controllers e DTOs carregam somente os dados necessarios.
spring.jpa.open-in-view=false

# Origens separadas por virgula. O valor * facilita o prototipo local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
