services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-classpath_mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Configure MONGO_INITDB_ROOT_PASSWORD no .env}
      MONGO_APP_USER: ${MONGO_APP_USER:-classpath_materiais_api}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Configure MONGO_APP_PASSWORD no .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-classpath_materiais}
    networks:
      - materials-db
    volumes:
      - mongo_data:/data/db
      - ./back-materiais/mongo-init.js:/docker-entrypoint-initdb.d/10-materials.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.getSiblingDB('admin').auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  back-academico:
    build: ./back-academico
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      ACADEMIC_ADMIN_TOKEN_HASH: ${ACADEMIC_ADMIN_TOKEN_HASH:?Configure ACADEMIC_ADMIN_TOKEN_HASH no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${BIND_IP:-127.0.0.1}:${ACADEMICO_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/disciplinas"]
      interval: 5s
      timeout: 5s
      retries: 24

  back-materiais:
    build: ./back-materiais
    networks:
      - default
      - materials-db
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-classpath_materiais}
      MONGO_APP_USER: ${MONGO_APP_USER:-classpath_materiais_api}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Configure MONGO_APP_PASSWORD no .env}
      MATERIALS_ADMIN_TOKEN_HASH: ${MATERIALS_ADMIN_TOKEN_HASH:?Configure MATERIALS_ADMIN_TOKEN_HASH no .env}
      MATERIALS_MAX_UPLOAD_BYTES: ${MATERIALS_MAX_UPLOAD_BYTES:-20971520}
      CORS_ALLOWED_ORIGINS: ${MATERIALS_CORS_ALLOWED_ORIGINS-${CORS_ALLOWED_ORIGINS:-}}
    ports:
      - "${BIND_IP}:${MATERIAIS_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/materiais?limit=1', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 24

  front-admin:
    build: ./front-admin
    depends_on:
      back-academico:
        condition: service_healthy
      back-materiais:
        condition: service_healthy
    environment:
      URL_SPRING_BOOT: http://back-academico:8080/api
      URL_FASTAPI: http://back-materiais:8000/api
      SECRET_KEY: ${ADMIN_SECRET_KEY:?Configure ADMIN_SECRET_KEY no .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Configure ADMIN_USERNAME no .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configure ADMIN_PASSWORD_HASH no .env}
      ACADEMIC_ADMIN_TOKEN: ${ACADEMIC_ADMIN_TOKEN:?Configure ACADEMIC_ADMIN_TOKEN no .env}
      MATERIALS_ADMIN_TOKEN: ${MATERIALS_ADMIN_TOKEN:?Configure MATERIALS_ADMIN_TOKEN no .env}
      MATERIALS_MAX_UPLOAD_BYTES: ${MATERIALS_MAX_UPLOAD_BYTES:-20971520}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT}:5000"

  front-aluno:
    build:
      context: ./front-aluno
      args:
        API_URL: http://${PUBLIC_HOST}:${ACADEMICO_PORT}/api
        MATERIAIS_API_URL: http://${PUBLIC_HOST}:${MATERIAIS_PORT}/api
        PERIODO: ${PERIODO}
    depends_on:
      back-academico:
        condition: service_healthy
      back-materiais:
        condition: service_healthy
    ports:
      - "${BIND_IP}:${ALUNO_PORT}:80"

  landing-page:
    image: nginx:alpine
    volumes:
      - ./landing-page:/usr/share/nginx/html:ro
    ports:
      - "${BIND_IP}:${LANDING_PORT}:80"

volumes:
  postgres_data:
  mongo_data:

networks:
  materials-db:
    internal: true
