services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok ? quit(0) : quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  back-academico:
    build: ./back-academico
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SHOW_SQL: ${SHOW_SQL:-false}
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST}:${ALUNO_PORT},http://${BIND_IP}:${ALUNO_PORT}
    ports:
      - "${BIND_IP}:${ACADEMICO_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/disciplinas"]
      interval: 5s
      timeout: 5s
      retries: 24

  back-materiais:
    build: ./back-materiais
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    ports:
      - "${BIND_IP}:${MATERIAIS_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/materiais', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 24

  front-admin:
    build: ./front-admin
    depends_on:
      back-academico:
        condition: service_healthy
      back-materiais:
        condition: service_healthy
    environment:
      URL_SPRING_BOOT: http://back-academico:8080/api
      URL_FASTAPI: http://back-materiais:8000/api
      SECRET_KEY: ${ADMIN_SECRET_KEY:?Configure ADMIN_SECRET_KEY no .env}
    ports:
      - "${BIND_IP}:${ADMIN_PORT}:5000"

  front-aluno:
    build:
      context: ./front-aluno
      args:
        API_URL: http://${PUBLIC_HOST}:${ACADEMICO_PORT}/api
        MATERIAIS_API_URL: http://${PUBLIC_HOST}:${MATERIAIS_PORT}/api
        PERIODO: ${PERIODO}
    depends_on:
      back-academico:
        condition: service_healthy
      back-materiais:
        condition: service_healthy
    ports:
      - "${BIND_IP}:${ALUNO_PORT}:80"

  landing-page:
    image: nginx:alpine
    volumes:
      - ./landing-page:/usr/share/nginx/html:ro
    ports:
      - "${BIND_IP}:${LANDING_PORT}:80"

volumes:
  postgres_data:
  mongo_data:
