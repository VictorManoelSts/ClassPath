<div class="app-shell">
  <a class="pular-para-conteudo" href="#inicio" (click)="focarConteudo($event, conteudo)">
    Pular para o conteúdo
  </a>

  @if (!online()) {
    <div class="offline-bar" role="status">
      Você está sem conexão. Os dados na tela podem estar desatualizados.
    </div>
  }

  <app-topbar />

  <main #conteudo id="inicio" class="page-content" tabindex="-1">
    <router-outlet />
  </main>

  <footer>
    <div class="footer-brand">
      <span aria-hidden="true">CP</span>
      <strong>ClassPath</strong>
    </div>
    <p>Disciplinas, horários, materiais e avisos do período {{ periodo }}.</p>
  </footer>
</div>
