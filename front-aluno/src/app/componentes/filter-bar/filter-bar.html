<section class="filter-bar">
  <label for="disciplina">Disciplina</label>

  <div class="select-wrap">
    <select id="disciplina" [disabled]="desabilitado()" (change)="aoMudar($event)">
      <option value="" [selected]="!disciplinaId()">Todas as disciplinas</option>
      @for (disciplina of disciplinas(); track disciplina.id) {
        <option [value]="disciplina.id" [selected]="estaSelecionada(disciplina.id)">
          {{ disciplina.nome }}
        </option>
      }
    </select>

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </div>

  @if (disciplinaId()) {
    <button class="clear-filter" type="button" (click)="alterar.emit('')">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
      Limpar
    </button>
  }
</section>
