@if (carregando()) {
  <app-loading-cards [quantidade]="2" />
} @else if (erro()) {
  <app-error-state [mensagem]="erro()" (tentarNovamente)="tentarNovamente.emit()" />
} @else if (!itens().length) {
  <app-empty-state
    titulo="Nenhum material disponível"
    texto="Os arquivos publicados para suas disciplinas aparecerão aqui."
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
      <path d="M14 2v4a2 2 0 0 0 2 2h4" />
      <path d="M10 9H8" />
      <path d="M16 13H8" />
      <path d="M16 17H8" />
    </svg>
  </app-empty-state>
} @else {
  <div class="material-grid">
    @for (material of itens(); track material.id) {
      <article class="material-card">
        <span class="material-file-icon" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
            <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          </svg>
        </span>

        <div class="material-info">
          <span class="material-discipline">{{ material.disciplina }}</span>
          <h3>{{ material.nome }}</h3>
          <p>
            {{ material.tipo }} · {{ material.data }}
            @if (material.tamanho) {
              · {{ material.tamanho }}
            }
          </p>
        </div>

        <a
          class="material-download"
          [href]="material.href"
          [attr.download]="material.nome"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'Baixar ' + material.nome"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" x2="12" y1="15" y2="3" />
          </svg>
          Baixar
        </a>
      </article>
    }
  </div>
}
