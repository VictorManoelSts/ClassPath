@if (carregando()) {
  <app-loading-cards [quantidade]="3" />
} @else if (!disciplinas().length) {
  <app-empty-state
    titulo="Nenhuma disciplina cadastrada"
    texto="Assim que a coordenação cadastrar as disciplinas, elas aparecem aqui."
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
    </svg>
  </app-empty-state>
} @else {
  <div class="discipline-grid">
    @for (disciplina of disciplinas(); track disciplina.id) {
      <article class="discipline-card">
        <h3>{{ disciplina.nome }}</h3>
        <p>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="5" />
            <path d="M20 21a8 8 0 0 0-16 0" />
          </svg>
          {{ disciplina.professor }}
        </p>
        @if (!temFiltro()) {
          <button type="button" (click)="aoSelecionar(disciplina.id)">
            Ver só esta disciplina
          </button>
        }
      </article>
    }
  </div>
}
