@if (carregando()) {
  <div class="schedule-panel">
    <app-loading-rows [quantidade]="4" />
  </div>
} @else if (!ordenados().length) {
  <app-empty-state
    titulo="Nenhuma aula nesta seleção"
    texto="Troque a disciplina no filtro para ver outra grade."
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M8 2v4" />
      <path d="M16 2v4" />
      <rect width="18" height="18" x="3" y="4" rx="2" />
      <path d="M3 10h18" />
      <path d="M8 14h.01" />
      <path d="M12 14h.01" />
      <path d="M16 14h.01" />
      <path d="M8 18h.01" />
      <path d="M12 18h.01" />
      <path d="M16 18h.01" />
    </svg>
  </app-empty-state>
} @else {
  <div class="view-switch" role="group" aria-label="Formato da grade">
    <button
      type="button"
      [class.ativa]="visao() === 'grade'"
      [attr.aria-pressed]="visao() === 'grade'"
      (click)="mostrar('grade')"
    >
      Semana
    </button>
    <button
      type="button"
      [class.ativa]="visao() === 'lista'"
      [attr.aria-pressed]="visao() === 'lista'"
      (click)="mostrar('lista')"
    >
      Lista
    </button>
  </div>

  @if (visao() === "grade") {
    <app-week-grid [horarios]="ordenados()" />
  } @else {
    <app-schedule-list [horarios]="ordenados()" />
  }
}
