<div class="schedule-panel">
  @for (grupo of porDia(); track grupo.dia) {
    <div class="schedule-day">
      <div class="schedule-day-label">{{ grupo.dia }}</div>
      @for (horario of grupo.aulas; track horario.id) {
        <article class="schedule-row">
          <div class="time-block">
            <strong>{{ hora(horario.horarioInicio) }}</strong>
            <span>às {{ hora(horario.horarioFim) }}</span>
          </div>
          <div class="class-block">{{ horario.disciplinaNome }}</div>
          <div class="room-block">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
              />
              <circle cx="12" cy="10" r="3" />
            </svg>
            {{ horario.sala || "Sala a definir" }}
          </div>
        </article>
      }
    </div>
  }
</div>
