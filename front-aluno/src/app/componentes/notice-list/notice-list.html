@if (carregando()) {
  <app-loading-cards [quantidade]="2" />
} @else if (!avisos().length) {
  <app-empty-state
    titulo="Nenhum aviso por enquanto"
    texto="Os avisos das suas disciplinas aparecem aqui assim que forem publicados."
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M10.268 21a2 2 0 0 0 3.464 0" />
      <path
        d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
      />
    </svg>
  </app-empty-state>
} @else {
  <div class="notice-grid">
    @for (aviso of ordenados(); track aviso.id) {
      <article class="notice-card">
        <div class="notice-topline">
          <span>{{ aviso.disciplinaNome }}</span>
          <time [attr.datetime]="aviso.dataPublicacao">{{ data(aviso) }}</time>
        </div>
        <h3>{{ aviso.titulo }}</h3>
        <p>{{ aviso.descricao }}</p>
        <app-attachments [aviso]="aviso" />
      </article>
    }
  </div>
}
