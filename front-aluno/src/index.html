<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portal acadêmico ClassPath para consulta de disciplinas, horários e avisos."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)" />
    <title>ClassPath | Portal do aluno</title>
    <base href="/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Aplica o tema salvo antes da primeira pintura. Sem isso o
         Angular só define o tema depois de montar e a tela pisca branco. -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem("classpath-tema");
          var escuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            salvo === "dark" || salvo === "light" ? salvo : escuro ? "dark" : "light";
        } catch (e) {
          /* modo anônimo: cai no padrão do CSS */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
